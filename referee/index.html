<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Futsal Match Control · Referee &amp; Judge Panel</title>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Referee">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121817">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1312;
      --bg-raised: #161c1b;
      --card: #1a201f;
      --card-glow: rgba(120, 72, 52, .34);
      --card-shadow: none;
      --chip: #1c2322;
      --seg-on: #2a3331;
      --line: #2a3331;
      --line-soft: #26302e;
      --line-hover: #3b4644;
      --fg: #eef1ef;
      --fg-muted: #9aa5a2;
      --fg-dim: #6f7a77;
      --teal: #3d8a89;
      --teal-hover: #47a09e;
      --on-teal: #eef1ef;
      --green-fg: #7cc092;
      --green-bg: #1b3326;
      --amber-fg: #e0aa4d;
      --amber-bg: #392b19;
      --blue-fg: #86b2e6;
      --blue-bg: #1d2a3b;
      --rose-fg: #e39a8e;
      --rose-bg: #3a2220;
      --live: #d9775f;
      --backdrop: rgba(5, 8, 8, .72);
      --gold: #e3b553;
      --field: #0e1312;
      --teal-ring: rgba(71, 160, 158, .25);
      --brand-accent: #86b2e6;
      --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
      --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius: 16px;
      --gutter-l: max(12px, env(safe-area-inset-left, 0px));
      --gutter-r: max(12px, env(safe-area-inset-right, 0px));
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --brand-accent: #1f4f99;
        --bg: #eff1ef;
        --bg-raised: #ffffff;
        --card: #ffffff;
        --card-glow: rgba(226, 168, 158, .32);
        --card-shadow: 0 1px 2px rgba(20, 26, 25, .06), 0 6px 18px -8px rgba(20, 26, 25, .12);
        --chip: #e2e7e5;
        --seg-on: #ffffff;
        --line: #d9dfdd;
        --line-soft: #e4e9e7;
        --line-hover: #b9c3c0;
        --fg: #141a19;
        --fg-muted: #56625f;
        --fg-dim: #7d8885;
        --teal: #2f7a79;
        --teal-hover: #276867;
        --on-teal: #ffffff;
        --green-fg: #2f7a46;
        --green-bg: #e1f1e6;
        --amber-fg: #94650f;
        --amber-bg: #f8ecd3;
        --blue-fg: #2f5f99;
        --blue-bg: #e2ecf8;
        --rose-fg: #a5463a;
        --rose-bg: #f8e3e0;
        --live: #c4573e;
        --backdrop: rgba(20, 26, 25, .45);
        --gold: #d9a632;
        --field: #f6f8f7;
        --teal-ring: rgba(47, 122, 121, .18);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --brand-accent: #1f4f99;
      --bg: #eff1ef;
      --bg-raised: #ffffff;
      --card: #ffffff;
      --card-glow: rgba(226, 168, 158, .32);
      --card-shadow: 0 1px 2px rgba(20, 26, 25, .06), 0 6px 18px -8px rgba(20, 26, 25, .12);
      --chip: #e2e7e5;
      --seg-on: #ffffff;
      --line: #d9dfdd;
      --line-soft: #e4e9e7;
      --line-hover: #b9c3c0;
      --fg: #141a19;
      --fg-muted: #56625f;
      --fg-dim: #7d8885;
      --teal: #2f7a79;
      --teal-hover: #276867;
      --on-teal: #ffffff;
      --green-fg: #2f7a46;
      --green-bg: #e1f1e6;
      --amber-fg: #94650f;
      --amber-bg: #f8ecd3;
      --blue-fg: #2f5f99;
      --blue-bg: #e2ecf8;
      --rose-fg: #a5463a;
      --rose-bg: #f8e3e0;
      --live: #c4573e;
      --backdrop: rgba(20, 26, 25, .45);
      --gold: #d9a632;
      --field: #f6f8f7;
      --teal-ring: rgba(47, 122, 121, .18);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.4;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* Mobile Forced Landscape Mode (CSS rotation fallback when orientation.lock isn't available) */
    body.force-landscape {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      min-height: 0;
      transform: rotate(90deg);
      transform-origin: top left;
      overflow: hidden;
    }

    svg.i {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    :focus-visible { outline: 2px solid var(--teal-hover); outline-offset: 2px; border-radius: 8px; }

    .wrap {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding-left: var(--gutter-l);
      padding-right: var(--gutter-r);
    }

    /* Slim Sticky Header */
    .site-header {
      flex: none;
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg-raised) 94%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .site-header .wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-block: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .02em;
      text-transform: uppercase;
      line-height: 1;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex: none;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--teal), color-mix(in srgb, var(--teal) 55%, #0e1312));
      color: var(--on-teal);
    }

    .bn-split { display: grid; gap: 1px; }
    .bn-top {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--brand-accent);
    }
    .bn-main { font-weight: 800; }

    .hdr-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }

    .hdr-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .save-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid var(--line-soft);
      color: var(--fg-muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .save-pill .dot-ok {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-fg);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--fg);
      font: 600 12.5px var(--font-body);
      cursor: pointer;
      white-space: nowrap;
      max-width: 230px;
    }
    .sync-pill:hover { background: var(--chip); border-color: var(--line-hover); }
    .sync-pill.linked {
      border-color: color-mix(in srgb, var(--green-fg) 55%, var(--line));
      background: color-mix(in srgb, var(--green-bg) 70%, var(--bg-raised));
      color: var(--green-fg);
    }
    .sync-pill.syncing {
      border-color: color-mix(in srgb, var(--amber-fg) 55%, var(--line));
      color: var(--amber-fg);
    }
    .sync-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg-dim);
      flex: none;
    }
    .sync-pill.linked .sync-dot { background: var(--green-fg); }
    .sync-pill.syncing .sync-dot { background: var(--amber-fg); animation: blink 1s infinite; }

    /* Tournament / Match Picker List */
    .conn-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 7px;
      max-height: 340px;
      overflow-y: auto;
    }
    .conn-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--fg);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .conn-item:hover { border-color: var(--teal); background: var(--chip); }
    .conn-item.active { border-color: var(--green-fg); background: color-mix(in srgb, var(--green-bg) 55%, var(--field)); }
    .conn-item b { display: block; font-size: 14.5px; }
    .conn-item small { color: var(--fg-muted); font-size: 12px; }
    .conn-err { color: var(--live); font-size: 13px; font-weight: 600; margin: 0; }
    .conn-user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 11px;
      background: var(--chip);
      font-size: 13px;
    }

    .icon-btn {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      color: var(--fg);
      border-radius: 9px;
      height: 34px;
      padding: 0 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font: 600 12.5px var(--font-body);
    }
    .icon-btn:hover { background: var(--chip); border-color: var(--line-hover); }
    .icon-btn.active { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }

    .theme-btn .ic-moon, :root.is-dark .theme-btn .ic-sun { display: none; }
    :root.is-dark .theme-btn .ic-moon { display: block; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      cursor: pointer;
      background: var(--teal);
      color: var(--on-teal);
      font: 600 13.5px/1 var(--font-body);
      padding: 9px 13px;
      border-radius: 10px;
      transition: background .12s, border-color .12s, transform .08s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--teal-hover); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }

    .btn-ghost {
      background: var(--bg-raised);
      color: var(--fg);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { background: var(--chip); border-color: var(--line-hover); }

    .btn-live { background: var(--live); color: #fff; }
    .btn-live:hover { background: var(--live); filter: brightness(1.08); }

    .btn-amber {
      background: var(--amber-bg);
      color: var(--amber-fg);
      border: 1px solid color-mix(in srgb, var(--amber-fg) 40%, var(--line));
    }
    .btn-amber:hover { background: color-mix(in srgb, var(--amber-fg) 22%, var(--amber-bg)); }

    .btn-danger {
      background: var(--rose-bg);
      color: var(--rose-fg);
      border: 1px solid color-mix(in srgb, var(--live) 40%, var(--line));
    }
    .btn-danger:hover { background: var(--live); color: #fff; }

    .btn-sm { font-size: 13px; padding: 7px 11px; border-radius: 9px; }
    .btn-xs { font-size: 12px; padding: 5px 8px; border-radius: 8px; }

    /* Tags & Status */
    .tag {
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 7px;
      line-height: 1.1;
    }
    .t-green { color: var(--green-fg); background: var(--green-bg); }
    .t-amber { color: var(--amber-fg); background: var(--amber-bg); }
    .t-rose { color: var(--rose-fg); background: var(--rose-bg); }

    .status {
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-size: 12px;
    }
    .status.upcoming { color: var(--teal); }
    .status.live { color: var(--live); }
    .status.live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: blink 1.3s ease-in-out infinite;
    }
    .status.halftime { color: var(--amber-fg); }
    .status.done { color: var(--fg-dim); }
    @keyframes blink { 50% { opacity: .25; } }

    .kicker {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin: 0;
    }

    /* Main Workspace Layout */
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding-block: 10px 12px;
      min-height: 0;
    }

    .dashboard {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* Active 1-Min Timeout Banner */
    .timeout-banner {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--amber-bg);
      border: 1px solid color-mix(in srgb, var(--amber-fg) 55%, var(--line));
      color: var(--amber-fg);
    }
    .timeout-banner strong {
      font-family: var(--font-display);
      font-size: 20px;
      text-transform: uppercase;
    }
    .timeout-clock {
      font: 800 28px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }

    /* Top Row: 3-Column Scoreboard Arena */
    .arena {
      flex: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .card-flat {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--bg-raised);
      box-shadow: var(--card-shadow);
      padding: 12px 14px;
    }

    /* Team Panel */
    .team-panel {
      --tc: var(--teal);
      border-top: 4px solid var(--tc);
      background:
        radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--tc) 14%, transparent), transparent 60%),
        var(--bg-raised);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .tp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--field);
      cursor: pointer;
      flex: none;
    }
    .color-dot::-webkit-color-swatch-wrapper { padding: 0; }
    .color-dot::-webkit-color-swatch { border: 0; border-radius: 5px; }

    .tp-name-input {
      flex: 1 1 0;
      min-width: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 2px 6px;
      margin: -2px -6px;
      color: var(--fg);
      font: 800 24px/1.05 var(--font-display);
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .tp-name-input:hover { border-color: var(--line); background: var(--field); }
    .tp-name-input:focus { outline: none; border-color: var(--teal); background: var(--field); }

    .side-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--fg-muted);
      flex: none;
    }

    /* Score Control */
    .score-box {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 13px;
      background: var(--field);
      border: 1px solid var(--line-soft);
    }
    .score-num {
      text-align: center;
      font: 800 58px/.88 var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      user-select: none;
    }
    .score-btn {
      height: 46px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--fg);
      font: 700 24px/1 var(--font-body);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .score-btn:hover { background: var(--chip); border-color: var(--line-hover); }
    .score-btn:active { transform: scale(.95); }
    .score-btn.plus {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--on-teal);
    }
    .score-btn.plus:hover { background: var(--teal-hover); }

    /* Accumulated Fouls */
    .fouls-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 11px;
      background: var(--chip);
      border: 1px solid var(--line-soft);
      flex-wrap: wrap;
    }
    .fouls-box.foul-warn {
      background: var(--amber-bg);
      border-color: color-mix(in srgb, var(--amber-fg) 45%, var(--line));
    }
    .fouls-box.foul-danger {
      background: var(--rose-bg);
      border-color: color-mix(in srgb, var(--live) 55%, var(--line));
    }
    .fouls-left { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .fouls-label { font-size: 12px; font-weight: 700; color: var(--fg-muted); }
    .foul-warn .fouls-label { color: var(--amber-fg); }
    .foul-danger .fouls-label { color: var(--rose-fg); }

    .foul-pips { display: flex; align-items: center; gap: 4px; }
    .foul-pip {
      width: 14px;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
    }
    .foul-pip.on { background: var(--amber-fg); border-color: var(--amber-fg); }
    .foul-pip.on.fifth { background: var(--live); border-color: var(--live); }
    .foul-count-txt {
      font: 800 15px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
      margin-left: 3px;
    }

    /* Action Buttons Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: auto;
    }
    .act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 6px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--fg);
      font: 600 12.5px var(--font-body);
      cursor: pointer;
      white-space: nowrap;
    }
    .act-btn:hover { background: var(--chip); border-color: var(--line-hover); }
    .act-btn:active { transform: scale(.97); }
    .act-btn.to-used {
      background: var(--amber-bg);
      border-color: color-mix(in srgb, var(--amber-fg) 45%, var(--line));
      color: var(--amber-fg);
    }

    .bk {
      flex: none;
      display: inline-block;
      width: 9px;
      height: 12px;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
    .bk-y { background: linear-gradient(160deg, #ffe066, #f2b705); }
    .bk-r { background: linear-gradient(160deg, #ff5a4e, #c81e1e); }

    /* Center Clock / Penalty Shootout Panel */
    .clock-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      text-align: center;
    }
    .clock-panel.is-running {
      border-color: color-mix(in srgb, var(--live) 55%, var(--line));
      background:
        radial-gradient(110% 100% at 50% 0%, color-mix(in srgb, var(--live) 15%, transparent), transparent 65%),
        var(--bg-raised);
    }
    .clock-panel.is-penalties {
      border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
      background:
        radial-gradient(110% 100% at 50% 0%, color-mix(in srgb, var(--gold) 15%, transparent), transparent 65%),
        var(--bg-raised);
    }

    .input, select.input {
      width: 100%;
      min-width: 0;
      min-height: 36px;
      font: 600 14px var(--font-body);
      color: var(--fg);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .input:focus, select.input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-ring);
    }

    .period-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
    }
    .period-select {
      text-align: center;
      font: 800 16px var(--font-display);
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .clock-display {
      font: 800 56px/.9 var(--font-display);
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
      padding: 10px 8px;
      border-radius: 13px;
      background: var(--field);
      border: 1px solid var(--line-soft);
      color: var(--fg);
      user-select: none;
    }
    .clock-panel.is-running .clock-display {
      color: var(--live);
      border-color: color-mix(in srgb, var(--live) 40%, var(--line));
    }
    .clock-display.is-zero { color: var(--gold); animation: blink 1s ease-in-out infinite; }

    .clock-nudge { display: flex; justify-content: center; gap: 5px; }
    .clock-nudge button {
      padding: 3px 8px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--fg-muted);
      font: 700 11.5px var(--font-body);
      cursor: pointer;
    }
    .clock-nudge button:hover { color: var(--fg); border-color: var(--line-hover); }

    .clock-btns { display: grid; grid-template-columns: 1.5fr 1fr; gap: 6px; }

    .clock-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding-top: 7px;
      border-top: 1px solid var(--line-soft);
    }
    .mini-field { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .mini-field span {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--fg-dim);
      white-space: nowrap;
    }
    .mini-field input {
      width: 52px;
      min-height: 28px;
      padding: 2px 6px;
      font-size: 13px;
      text-align: center;
    }

    /* Dedicated Penalty Shootout Layout (No Timer!) */
    .shootout-box {
      display: grid;
      gap: 8px;
      text-align: center;
    }
    .so-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--gold) 15%, var(--field));
      border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line));
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--amber-fg);
    }
    .so-score {
      font: 800 44px/.9 var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      padding: 6px 0;
    }
    .so-rows {
      display: grid;
      gap: 6px;
      text-align: left;
    }
    .so-team-row {
      display: grid;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--field);
      border: 1px solid var(--line-soft);
    }
    .so-team-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .so-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .so-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px dashed var(--line-hover);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--fg-dim);
    }
    .so-dot.hit {
      border-style: solid;
      border-color: var(--green-fg);
      background: var(--green-bg);
      color: var(--green-fg);
    }
    .so-dot.miss {
      border-style: solid;
      border-color: var(--live);
      background: var(--rose-bg);
      color: var(--rose-fg);
    }
    .so-winner {
      padding: 6px 10px;
      border-radius: 9px;
      background: var(--green-bg);
      color: var(--green-fg);
      font-size: 12.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .so-foot {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    /* Bottom Deck: 3-Column Symmetry (Left Players | Events & Suspensions | Right Players) */
    .deck {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 10px;
    }

    .deck-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .deck-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .deck-head h3 {
      margin: 0;
      font: 800 18px/1 var(--font-display);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .scroll-area {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* Roster */
    .roster-add-row {
      flex: none;
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 6px;
      margin-bottom: 8px;
    }
    .roster-add-row input { min-height: 34px; padding: 5px 8px; font-size: 13px; }

    .roster-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
    .player-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 10px;
      background: var(--field);
      border: 1px solid var(--line-soft);
    }
    .player-row.sent-off {
      opacity: .6;
      border-color: color-mix(in srgb, var(--live) 45%, var(--line));
      background: color-mix(in srgb, var(--rose-bg) 45%, var(--field));
    }
    .p-num {
      min-width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--chip);
      color: var(--fg-muted);
      font: 800 13px var(--font-display);
      display: grid;
      place-items: center;
      flex: none;
    }
    .p-name { flex: 1 1 0; min-width: 0; display: grid; gap: 1px; }
    .p-name b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-badges { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-muted); flex-wrap: wrap; }
    .p-acts { display: flex; align-items: center; gap: 3px; flex: none; }
    .p-act {
      height: 26px;
      min-width: 26px;
      padding: 0 6px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--fg);
      font: 700 11.5px var(--font-body);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .p-act:hover { background: var(--chip); border-color: var(--line-hover); }

    /* Center Deck: Suspensions + Events */
    .susp-banner-list {
      flex: none;
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .susp-item {
      display: grid;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--rose-bg) 55%, var(--field));
      border: 1px solid color-mix(in srgb, var(--live) 45%, var(--line));
    }
    .susp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .susp-who { display: grid; min-width: 0; }
    .susp-who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .susp-who small { color: var(--fg-muted); font-size: 11px; }
    .susp-timer {
      font: 800 22px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--live);
    }
    .susp-bar { height: 4px; border-radius: 999px; background: var(--chip); overflow: hidden; }
    .susp-bar i { display: block; height: 100%; background: var(--live); transition: width .3s linear; }
    .susp-acts { display: flex; justify-content: space-between; gap: 6px; }

    .events-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
    .ev-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--field);
      border: 1px solid var(--line-soft);
      font-size: 12.5px;
    }
    .ev-time {
      flex: none;
      font: 800 12px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
      padding: 3px 6px;
      border-radius: 6px;
      background: var(--chip);
      color: var(--fg-muted);
      min-width: 44px;
      text-align: center;
    }
    .ev-body { flex: 1; min-width: 0; display: grid; }
    .ev-body b { font-weight: 700; }
    .ev-body small { color: var(--fg-muted); font-size: 11.5px; }
    .ev-del {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: var(--fg-dim);
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex: none;
    }
    .ev-del:hover { background: var(--rose-bg); color: var(--rose-fg); }

    .empty-note {
      margin: 0;
      padding: 14px 10px;
      text-align: center;
      border: 1.5px dashed var(--line);
      border-radius: 11px;
      color: var(--fg-muted);
      font-size: 13px;
    }

    /* Desktop One-Screen Lock (>= 1024px) */
    @media (min-width: 1024px) {
      body:not(.force-landscape) {
        height: 100dvh;
        overflow: hidden;
      }
      #btn-landscape { display: none; }
    }

    /* Tablet / Mobile Portrait */
    @media (max-width: 1023px) {
      body:not(.force-landscape) .arena { grid-template-columns: 1fr 1fr; }
      body:not(.force-landscape) .clock-panel { grid-column: 1 / -1; order: -1; }
      body:not(.force-landscape) .deck { grid-template-columns: 1fr; overflow: visible; }
      body:not(.force-landscape) .deck-col { overflow: visible; }
      body:not(.force-landscape) .scroll-area { overflow: visible; max-height: none; }
      body:not(.force-landscape) .action-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      body:not(.force-landscape) .arena { grid-template-columns: 1fr; }
      body:not(.force-landscape) .save-pill .save-txt { display: none; }
      body:not(.force-landscape) .hdr-status { display: none; }
    }

    /* True Mobile Landscape OR Forced Landscape Mode */
    body.force-landscape .arena,
    @media (orientation: landscape) and (max-height: 560px) {
      .arena { grid-template-columns: minmax(0, 1fr) 245px minmax(0, 1fr) !important; }
      .clock-panel { grid-column: auto !important; order: 0 !important; }
      .deck { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) !important; }
      .score-num { font-size: 44px; }
      .clock-display { font-size: 42px; padding: 6px; }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
    }
    body.force-landscape main { overflow-y: auto; }
    body.force-landscape .arena { grid-template-columns: minmax(0, 1fr) 240px minmax(0, 1fr); }
    body.force-landscape .clock-panel { grid-column: auto; order: 0; }
    body.force-landscape .deck { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    body.force-landscape .score-num { font-size: 44px; }
    body.force-landscape .clock-display { font-size: 42px; padding: 6px; }
    body.force-landscape .action-grid { grid-template-columns: repeat(2, 1fr); }

    /* Modal Sheet */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 14px;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
    }
    .sheet {
      position: relative;
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .55);
    }
    .sheet.report-sheet { max-width: 680px; }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px 12px;
      border-bottom: 1px solid var(--line-soft);
    }
    .sheet-head h3 {
      margin: 0;
      font: 800 24px/1 var(--font-display);
      text-transform: uppercase;
    }
    .sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .sheet-body {
      padding: 16px 18px;
      display: grid;
      gap: 12px;
      overflow-y: auto;
    }
    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 15px;
      border-top: 1px solid var(--line-soft);
      flex-wrap: wrap;
    }

    .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .pick-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--fg);
      font: 600 13.5px var(--font-body);
      cursor: pointer;
      text-align: left;
    }
    .pick-btn:hover { border-color: var(--teal); background: var(--chip); }
    .pick-btn.selected {
      border-color: var(--teal);
      background: color-mix(in srgb, var(--teal) 20%, var(--field));
      color: var(--fg);
      box-shadow: 0 0 0 2px var(--teal-ring);
    }
    .pick-btn:disabled { opacity: .4; cursor: default; }

    .goal-summary-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 11px;
      border-radius: 10px;
      background: var(--chip);
      font-size: 13px;
    }
    .goal-summary-strip b { color: var(--fg); }

    /* Match Report Document */
    .report-doc { display: grid; gap: 14px; }
    .rep-top { display: grid; gap: 5px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .rep-brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rep-brand strong { font: 800 19px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
    .rep-title { margin: 0; font: 800 26px/1.05 var(--font-display); text-transform: uppercase; }
    .rep-score-banner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-radius: 13px;
      background: var(--chip);
      border: 1px solid var(--line);
      text-align: center;
    }
    .rep-score-banner b { font: 800 22px/1.1 var(--font-display); text-transform: uppercase; }
    .rep-score-banner .rep-score {
      font: 800 42px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
      padding: 6px 14px;
      border-radius: 11px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
    }
    .rep-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px 14px;
      font-size: 13px;
      color: var(--fg-muted);
      padding: 10px 13px;
      border-radius: 11px;
      background: var(--field);
      border: 1px solid var(--line-soft);
    }
    .rep-meta b { color: var(--fg); }
    .rep-sec { display: grid; gap: 5px; padding-top: 9px; border-top: 1px dashed var(--line); }
    .rep-sec h4 { margin: 0; font: 800 16px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
    .rep-sec p { margin: 0; color: var(--fg-muted); font-size: 13.5px; }
    .rep-ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
    .rep-ul li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--field);
    }
    .rep-sigs { display: none; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 60;
      padding: 10px 16px;
      border-radius: 11px;
      background: var(--fg);
      color: var(--bg);
      font: 600 13.5px var(--font-body);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45);
      max-width: calc(100% - 28px);
      text-align: center;
    }

    @media print {
      :root, :root[data-theme="dark"] {
        color-scheme: light;
        --bg: #ffffff;
        --bg-raised: #ffffff;
        --card: #ffffff;
        --chip: #f2f4f3;
        --field: #f8f9f8;
        --line: #cfd6d4;
        --line-soft: #dfe5e3;
        --fg: #111111;
        --fg-muted: #444444;
        --fg-dim: #666666;
      }
      body.force-landscape { position: static; transform: none; width: auto; height: auto; }
      body > *:not(#report-modal) { display: none !important; }
      #report-modal { display: block !important; position: static !important; padding: 0 !important; }
      #report-modal .modal-backdrop, #report-modal .sheet-head, #report-modal .sheet-actions { display: none !important; }
      #report-modal .sheet { max-width: none !important; max-height: none !important; border: 0 !important; box-shadow: none !important; border-radius: 0 !important; }
      #report-modal .sheet-body { padding: 0 !important; overflow: visible !important; }
      .rep-sigs { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 34px; }
      .rep-sigs div { border-top: 1px solid #444; padding-top: 6px; font-size: 12px; color: #444; }
    }
  </style>
</head>

  <!-- Slim Top Control Bar -->
  <header class="site-header">

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (function () {
      const STORAGE_KEY = 'mubaaraiy.futsal.v2';
      const root = document.documentElement;
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) root.setAttribute('data-theme', savedTheme);
      } catch (e) {}

      function isDark() {
        const t = root.getAttribute('data-theme');
        return t ? t === 'dark' : darkQuery.matches;
      }
      function syncTheme() { root.classList.toggle('is-dark', isDark()); }
      document.getElementById('theme-btn').addEventListener('click', () => {
        const next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        syncTheme();
      });
      syncTheme();

      // Mobile Landscape Mode Toggle
      const landscapeBtn = document.getElementById('btn-landscape');
      let forcedLandscape = false;
      landscapeBtn.addEventListener('click', async () => {
        forcedLandscape = !forcedLandscape;
        landscapeBtn.classList.toggle('active', forcedLandscape);

        // Try native orientation lock if supported (works in installed PWA / fullscreen Android)
        if (forcedLandscape) {
          try {
            if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
              await document.documentElement.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape');
              toast('Landscape mode enabled');
              return;
            }
          } catch (e) {}
          document.body.classList.add('force-landscape');
          toast('Landscape layout enabled');
        } else {
          document.body.classList.remove('force-landscape');
          try {
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
          } catch (e) {}
          toast('Portrait mode restored');
        }
      });

      // Web Audio Buzzer
      let audioCtx = null;
      function playBuzzer(durationMs = 700, freq = 420) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + durationMs / 1000);
        } catch (e) {}
      }

      function defaultState() {
        return {
          status: 'upcoming', // upcoming | live | halftime | done
          period: '1st Half',
          halfMinutes: 20,
          breakMinutes: 15,
          clockSec: 20 * 60,
          clockRunning: false,
          swapped: false,
          timeout: null, // { team, sec }
          linked: null, // { tournamentId, tournamentName, matchId, matchNo, stage, ko, homeId, awayId }
          kickAt: null,
          htAt: null,
          h2At: null,
          shootout: {
            kicks: [] // { id, team: 'home'|'away', scored: true|false }
          },
          teams: {
            home: {
              name: 'City Futsal',
              color: '#3d8a89',
              score: 0,
              fouls: 0,
              timeouts: [false, false],
              players: []
            },
            away: {
              name: 'United Futsal',
              color: '#2f6aa8',
              score: 0,
              fouls: 0,
              timeouts: [false, false],
              players: []
            }
          },
          suspensions: [],
          events: [] // { id, period, clock, team, type, label, detail, player, assist }
        };
      }

      let state = loadState();
      state.clockRunning = false;
      if (!state.shootout) state.shootout = { kicks: [] };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          return Object.assign(defaultState(), JSON.parse(raw));
        } catch (e) {
          return defaultState();
        }
      }

      let saveTimeout = null;
      function saveState(skipCloud) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        const txt = document.querySelector('#save-pill .save-txt');
        if (txt) txt.textContent = 'Saving…';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          if (txt) txt.textContent = 'All changes saved';
        }, 300);
        if (!skipCloud && typeof scheduleCloudSync === 'function') scheduleCloudSync();
      }

      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const pad2 = n => String(Math.max(0, Math.floor(n))).padStart(2, '0');
      const fmtClock = sec => `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`;
      const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      let toastTimer = null;
      function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
      }

      function sides() {
        return state.swapped ? { left: 'away', right: 'home' } : { left: 'home', right: 'away' };
      }

      function activeHalfIndex() {
        return state.period === '2nd Half' || state.period === 'Extra Time 2' ? 1 : 0;
      }

      function addEvent(teamKey, type, label, detail = '', player = '', assist = '') {
        state.events.unshift({
          id: uid(),
          period: state.period,
          clock: state.period === 'Penalties' ? 'PEN' : fmtClock(state.clockSec),
          min: typeof elapsedMinute === 'function' ? elapsedMinute() : 1,
          team: teamKey,
          type,
          label,
          detail,
          player,
          assist
        });
      }

      function startSuspension(teamKey, playerName, seconds = 120) {
        state.suspensions.push({
          id: uid(),
          team: teamKey,
          player: playerName || 'Team Player',
          sec: seconds,
          total: seconds
        });
      }

      // Main 1-second Clock Loop
      setInterval(() => {
        let changed = false;

        if (state.timeout && state.timeout.sec > 0) {
          state.timeout.sec -= 1;
          changed = true;
          if (state.timeout.sec <= 0) {
            playBuzzer(800, 520);
            toast(`Timeout ended for ${state.teams[state.timeout.team].name}`);
            state.timeout = null;
          }
        }

        if (state.clockRunning && state.period !== 'Penalties') {
          if (state.clockSec > 0) {
            state.clockSec -= 1;
            changed = true;

            if (state.period !== 'Half-Time' && state.suspensions.length) {
              const finished = [];
              state.suspensions.forEach(s => {
                s.sec = Math.max(0, s.sec - 1);
                if (s.sec === 0) finished.push(s);
              });
              if (finished.length) {
                finished.forEach(s => {
                  toast(`2-min suspension ended: ${s.player}`);
                  addEvent(s.team, 'info', 'Suspension ended', s.player, s.player);
                });
                state.suspensions = state.suspensions.filter(s => s.sec > 0);
                playBuzzer(350, 620);
              }
            }

            if (state.clockSec === 0) {
              state.clockRunning = false;
              playBuzzer(1100, 380);
              toast(`${state.period} clock reached 00:00`);
            }
          } else {
            state.clockRunning = false;
            changed = true;
          }
        }

        if (changed) {
          saveState();
          renderClockAndTimers();
        }
      }, 1000);

      // Modals
      const actionModal = document.getElementById('action-modal');
      const reportModal = document.getElementById('report-modal');

      function openModal(title, bodyHtml, onMount, actionsHtml = '') {
        document.getElementById('am-title').textContent = title;
        const body = document.getElementById('am-body');
        body.innerHTML = bodyHtml;
        const acts = document.getElementById('am-actions');
        acts.innerHTML = `<button class="btn btn-ghost btn-sm" type="button" data-close>Cancel</button>${actionsHtml}`;
        actionModal.hidden = false;
        if (onMount) onMount(body, acts);
      }

      [actionModal, reportModal].forEach(m => {
        m.addEventListener('click', e => {
          if (e.target.closest('[data-close]')) m.hidden = true;
        });
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (!actionModal.hidden) actionModal.hidden = true;
          else if (!reportModal.hidden) reportModal.hidden = true;
        }
      });

      // Goal + Assist Recording
      function recordGoal(teamKey, delta, scorerName = '', assistName = '') {
        const team = state.teams[teamKey];
        if (delta < 0) {
          if (team.score <= 0) return;
          team.score -= 1;
          addEvent(teamKey, 'info', 'Score adjusted (-1)', `${team.name} now ${team.score}`);
          saveState(); render();
          return;
        }
        team.score += 1;
        if (state.status === 'upcoming') state.status = 'live';

        if (scorerName) {
          const p = team.players.find(x => x.name === scorerName);
          if (p) p.goals = (p.goals || 0) + 1;
        }
        if (assistName) {
          const a = team.players.find(x => x.name === assistName);
          if (a) a.assists = (a.assists || 0) + 1;
        }

        let detail = team.name;
        if (scorerName && assistName) detail = `${scorerName} (Assist: ${assistName}) · ${team.name}`;
        else if (scorerName) detail = `${scorerName} · ${team.name}`;
        else if (assistName) detail = `Assist: ${assistName} · ${team.name}`;

        addEvent(teamKey, 'goal', 'Goal', detail, scorerName, assistName);

        const oppKey = teamKey === 'home' ? 'away' : 'home';
        const mySusp = state.suspensions.filter(s => s.team === teamKey);
        const oppSusp = state.suspensions.filter(s => s.team === oppKey);
        // FIFA Futsal Law 12: if scoring team has MORE players on court than conceding team, end earliest conceding suspension
        if (oppSusp.length > mySusp.length) {
          const cleared = oppSusp[0];
          state.suspensions = state.suspensions.filter(s => s.id !== cleared.id);
          addEvent(oppKey, 'info', '2-min suspension ended (goal)', `${state.teams[oppKey].name} may bring on a replacement`, cleared.player);
          toast(`Goal · ${team.name}! ${state.teams[oppKey].name}'s 2:00 penalty ended — replacement may enter.`);
        } else {
          toast(`Goal · ${scorerName || team.name}${assistName ? ' (Ast: ' + assistName + ')' : ''}`);
        }
        saveState(); render();
      }

      function promptGoal(teamKey, preselectedScorer = '') {
        const team = state.teams[teamKey];
        const eligible = team.players.filter(p => !p.red);
        let selectedScorer = preselectedScorer;
        let selectedAssist = '';

        const renderPickerBody = (body, acts) => {
          const scorerBtns = eligible.map(p =>
            `<button class="pick-btn ${selectedScorer === p.name ? 'selected' : ''}" type="button" data-scorer="${esc(p.name)}">
              <span class="p-num">${esc(p.num || '–')}</span><span>${esc(p.name)}</span>
            </button>`
          ).join('');

          const assistBtns = eligible.map(p =>
            `<button class="pick-btn ${selectedAssist === p.name ? 'selected' : ''}" type="button" data-assist="${esc(p.name)}" ${selectedScorer && selectedScorer === p.name ? 'disabled' : ''}>
              <span class="p-num">${esc(p.num || '–')}</span><span>${esc(p.name)}</span>
            </button>`
          ).join('');

          body.innerHTML = `
            <div class="goal-summary-strip">
              <span>⚽ Scorer: <b>${esc(selectedScorer || 'None')}</b></span>
              <span>·</span>
              <span>🅰️ Assist: <b>${esc(selectedAssist || 'None')}</b></span>
            </div>

            <div style="display:grid;gap:6px;">
              <p class="kicker">1. WHO SCORED?</p>
              ${team.players.length ? `<div class="pick-grid">${scorerBtns}</div>` : ''}
              <input class="input" id="am-scorer-txt" type="text" placeholder="Type scorer name (optional)" value="${esc(selectedScorer)}">
            </div>

            <div style="display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line);">
              <p class="kicker">2. WHO ASSISTED? (OPTIONAL)</p>
              ${team.players.length ? `<div class="pick-grid">${assistBtns}</div>` : ''}
              <input class="input" id="am-assist-txt" type="text" placeholder="Type assisted player name (optional)" value="${esc(selectedAssist)}">
            </div>
          `;

          body.querySelectorAll('[data-scorer]').forEach(b => {
            b.addEventListener('click', () => {
              selectedScorer = selectedScorer === b.dataset.scorer ? '' : b.dataset.scorer;
              if (selectedAssist && selectedAssist === selectedScorer) selectedAssist = '';
              renderPickerBody(body, acts);
            });
          });
          body.querySelectorAll('[data-assist]').forEach(b => {
            b.addEventListener('click', () => {
              selectedAssist = selectedAssist === b.dataset.assist ? '' : b.dataset.assist;
              renderPickerBody(body, acts);
            });
          });
          body.querySelector('#am-scorer-txt').addEventListener('input', e => {
            selectedScorer = e.target.value.trim();
            body.querySelector('.goal-summary-strip b').textContent = selectedScorer || 'None';
          });
          body.querySelector('#am-assist-txt').addEventListener('input', e => {
            selectedAssist = e.target.value.trim();
            body.querySelectorAll('.goal-summary-strip b')[1].textContent = selectedAssist || 'None';
          });
        };

        openModal(
          `Goal & Assist · ${team.name}`,
          '',
          (body, acts) => {
            renderPickerBody(body, acts);
            acts.querySelector('#am-save-goal').addEventListener('click', () => {
              actionModal.hidden = true;
              recordGoal(teamKey, 1, selectedScorer, selectedAssist);
            });
          },
          `<button class="btn btn-sm" type="button" id="am-save-goal">Confirm Goal</button>`
        );
      }

      // Cards
      function recordCard(teamKey, cardType, playerName = '') {
        const team = state.teams[teamKey];
        const p = playerName ? team.players.find(x => x.name === playerName) : null;

        if (cardType === 'yellow') {
          if (p) p.yellow = (p.yellow || 0) + 1;
          addEvent(teamKey, 'yellow', 'Yellow card', playerName ? `${playerName} (${team.name})` : team.name, playerName);
          if (p && p.yellow >= 2 && !p.red) {
            p.red = 1;
            addEvent(teamKey, 'red', '2nd Yellow → Red card', `${playerName} sent off · 2:00 suspension`, playerName);
            startSuspension(teamKey, playerName, 120);
            toast(`2nd Yellow = Red card for ${playerName}! 2:00 suspension started.`);
          } else {
            toast(`Yellow card · ${playerName || team.name}`);
          }
        } else if (cardType === 'red') {
          if (p) p.red = (p.red || 0) + 1;
          addEvent(teamKey, 'red', 'Red card', `${playerName || team.name} · 2:00 suspension`, playerName);
          startSuspension(teamKey, playerName || `${team.name} player`, 120);
          toast(`Red card · ${playerName || team.name} (2:00 timer started)`);
        }
        saveState(); render();
      }

      function promptCard(teamKey, cardType) {
        const team = state.teams[teamKey];
        const title = cardType === 'red' ? 'Red Card (2:00 Suspension)' : 'Yellow Card';
        const playerBtns = team.players.filter(p => !p.red).map(p =>
          `<button class="pick-btn" type="button" data-pick="${esc(p.name)}">
            <span class="p-num">${esc(p.num || '–')}</span><span>${esc(p.name)}</span>
          </button>`
        ).join('');

        openModal(
          `${title} · ${team.name}`,
          `${team.players.length ? `<div class="pick-grid">${playerBtns}</div>` : ''}
           <input class="input" id="am-custom-p" type="text" placeholder="Or type player name / # (optional)">`,
          (body, acts) => {
            body.querySelectorAll('[data-pick]').forEach(b => {
              b.addEventListener('click', () => {
                actionModal.hidden = true;
                recordCard(teamKey, cardType, b.dataset.pick);
              });
            });
            acts.querySelector('#am-confirm').addEventListener('click', () => {
              const val = body.querySelector('#am-custom-p').value.trim();
              actionModal.hidden = true;
              recordCard(teamKey, cardType, val);
            });
          },
          `<button class="btn btn-sm" type="button" id="am-confirm">Confirm</button>`
        );
      }

      function promptPenalty(teamKey) {
        const team = state.teams[teamKey];
        const eligible = team.players.filter(p => !p.red);
        let selectedPlayer = '';
        let penKind = '6m Penalty';

        const renderPenBody = (body) => {
          const playerBtns = eligible.map(p =>
            `<button class="pick-btn ${selectedPlayer === p.name ? 'selected' : ''}" type="button" data-pen-p="${esc(p.name)}">
              <span class="p-num">${esc(p.num || '–')}</span><span>${esc(p.name)}</span>
            </button>`
          ).join('');

          const playerOpts = eligible.map(p =>
            `<option value="${esc(p.name)}" ${selectedPlayer === p.name ? 'selected' : ''}>${p.num ? '#' + esc(p.num) + ' ' : ''}${esc(p.name)}</option>`
          ).join('');

          body.innerHTML = `
            <div style="display:grid;gap:6px;">
              <p class="kicker">1. PENALTY TYPE</p>
              <div class="pick-grid">
                <button class="pick-btn ${penKind === '6m Penalty' ? 'selected' : ''}" type="button" data-pen-kind="6m Penalty">6m Penalty</button>
                <button class="pick-btn ${penKind === '10m Free Kick' ? 'selected' : ''}" type="button" data-pen-kind="10m Free Kick">10m Direct Free Kick</button>
              </div>
            </div>

            <div style="display:grid;gap:7px;padding-top:8px;border-top:1px dashed var(--line);">
              <p class="kicker">2. SELECT PENALTY TAKER</p>
              ${eligible.length
                ? `<select class="input" id="am-pen-sel" aria-label="Select penalty taker">
                     <option value="">Choose player from ${esc(team.name)}…</option>
                     ${playerOpts}
                   </select>
                   <div class="pick-grid">${playerBtns}</div>`
                : `<p class="empty-note" style="padding:10px;font-size:12.5px;">No players added for ${esc(team.name)} yet. Add players in the roster panel below, or type a player name here:</p>`
              }
              <input class="input" id="am-pen-txt" type="text" placeholder="Type player name / # (optional)" value="${esc(selectedPlayer)}">
            </div>

            <div style="display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line);">
              <p class="kicker">3. OUTCOME</p>
              <div class="pick-grid">
                <button class="btn" type="button" id="am-pen-goal">✓ Scored (+1 Goal)</button>
                <button class="btn btn-danger" type="button" id="am-pen-miss">× Saved / Missed</button>
              </div>
            </div>
          `;

          body.querySelectorAll('[data-pen-kind]').forEach(b => {
            b.addEventListener('click', () => { penKind = b.dataset.penKind; renderPenBody(body); });
          });
          const selEl = body.querySelector('#am-pen-sel');
          if (selEl) {
            selEl.addEventListener('change', e => {
              selectedPlayer = e.target.value;
              renderPenBody(body);
            });
          }
          body.querySelectorAll('[data-pen-p]').forEach(b => {
            b.addEventListener('click', () => {
              selectedPlayer = selectedPlayer === b.dataset.penP ? '' : b.dataset.penP;
              renderPenBody(body);
            });
          });
          body.querySelector('#am-pen-txt').addEventListener('input', e => {
            selectedPlayer = e.target.value.trim();
          });

          const finish = (scored) => {
            const kicker = selectedPlayer;
            if (scored) {
              team.score += 1;
              if (state.status === 'upcoming') state.status = 'live';
              if (kicker) {
                const pl = team.players.find(x => x.name === kicker);
                if (pl) pl.goals = (pl.goals || 0) + 1;
              }
              // FIFA Law 12: auto-end opponent's 2-min suspension if scoring with numerical advantage
              const oppKey = teamKey === 'home' ? 'away' : 'home';
              const mySusp = state.suspensions.filter(s => s.team === teamKey);
              const oppSusp = state.suspensions.filter(s => s.team === oppKey);
              if (oppSusp.length > mySusp.length) {
                const cleared = oppSusp[0];
                state.suspensions = state.suspensions.filter(s => s.id !== cleared.id);
                addEvent(oppKey, 'info', '2-min suspension ended (goal)', `${state.teams[oppKey].name} may bring on a replacement`, cleared.player);
              }
            }
            const detail = kicker ? `${kicker} · ${team.name}` : team.name;
            addEvent(teamKey, scored ? 'goal' : 'info', `${penKind} · ${scored ? 'Scored' : 'Missed'}`, detail, kicker);
            actionModal.hidden = true;
            saveState(); render();
            toast(`${penKind} ${scored ? 'scored' : 'missed'}${kicker ? ' by ' + kicker : ''} (${team.name})`);
          };

          body.querySelector('#am-pen-goal').addEventListener('click', () => finish(true));
          body.querySelector('#am-pen-miss').addEventListener('click', () => finish(false));
        };

        openModal(`Penalty · ${team.name}`, '', (body) => renderPenBody(body));
      }

      function triggerTimeout(teamKey) {
        if (state.period !== '1st Half' && state.period !== '2nd Half') {
          toast('No time-outs allowed in Extra Time, Half-Time, or Penalties (FIFA rule).');
          return;
        }
        const team = state.teams[teamKey];
        const idx = state.period === '2nd Half' ? 1 : 0;
        const halfLbl = idx === 0 ? '1H' : '2H';
        if (team.timeouts[idx]) {
          team.timeouts[idx] = false;
          toast(`Timeout · ${halfLbl} reset for ${team.name}`);
        } else {
          team.timeouts[idx] = true;
          state.clockRunning = false;
          state.timeout = { team: teamKey, sec: 60 };
          addEvent(teamKey, 'timeout', `Timeout · ${halfLbl}`, team.name);
          playBuzzer(300, 500);
          toast(`1-minute timeout started for ${team.name}`);
        }
        saveState(); render();
      }

      function adjustFoul(teamKey, delta) {
        const team = state.teams[teamKey];
        team.fouls = Math.max(0, team.fouls + delta);
        if (delta > 0) {
          const note = team.fouls >= 6 ? `Foul #${team.fouls} (10m Direct Free Kick!)` : `Foul #${team.fouls} / 5`;
          addEvent(teamKey, 'foul', 'Accumulated foul', `${team.name} · ${note}`);
          if (team.fouls >= 6) {
            playBuzzer(450, 460);
            toast(`${team.name}: Foul #${team.fouls} — 10m Direct Free Kick!`);
          }
        }
        saveState(); render();
      }

      // Penalty Shootout Logic (No Time Limit!)
      function shootoutStats() {
        const kicks = state.shootout.kicks || [];
        const hKicks = kicks.filter(k => k.team === 'home');
        const aKicks = kicks.filter(k => k.team === 'away');
        const hScore = hKicks.filter(k => k.scored).length;
        const aScore = aKicks.filter(k => k.scored).length;
        const maxTaken = Math.max(hKicks.length, aKicks.length);
        const slots = Math.max(5, maxTaken + (hKicks.length === aKicks.length && maxTaken >= 5 && hScore === aScore ? 1 : 0));

        let winner = null;
        if (maxTaken <= 5) {
          const hLeft = 5 - hKicks.length;
          const aLeft = 5 - aKicks.length;
          if (hScore > aScore + aLeft) winner = 'home';
          else if (aScore > hScore + hLeft) winner = 'away';
        }
        if (!winner && hKicks.length >= 5 && hKicks.length === aKicks.length && hScore !== aScore) {
          winner = hScore > aScore ? 'home' : 'away';
        }

        const round = Math.min(slots, Math.max(1, Math.min(hKicks.length, aKicks.length) + 1));
        const suddenDeath = hKicks.length >= 5 && aKicks.length >= 5 && !winner;
        return { hKicks, aKicks, hScore, aScore, slots, round, suddenDeath, winner };
      }

      function recordShootoutKick(teamKey, scored, playerName = '') {
        if (state.status === 'upcoming') state.status = 'live';
        state.shootout.kicks.push({ id: uid(), team: teamKey, scored, player: playerName });
        const team = state.teams[teamKey];
        const detail = playerName ? `${playerName} · ${team.name}` : team.name;
        addEvent(teamKey, scored ? 'goal' : 'info', `Shootout · ${scored ? 'Scored' : 'Missed'}`, detail, playerName);
        saveState(); render();
      }

      function promptShootoutKick(teamKey, scored) {
        const team = state.teams[teamKey];
        // FIFA Futsal rule: sent-off players are not permitted to take penalties
        const eligible = team.players.filter(p => !p.red);
        const takenNames = state.shootout.kicks.filter(k => k.team === teamKey && k.player).map(k => k.player);

        const playerBtns = eligible.map(p => {
          const count = takenNames.filter(n => n === p.name).length;
          return `<button class="pick-btn" type="button" data-so-p="${esc(p.name)}">
            <span class="p-num">${esc(p.num || '–')}</span>
            <span>${esc(p.name)}${count ? ` <small style="color:var(--fg-muted);">(×${count})</small>` : ''}</span>
          </button>`;
        }).join('');

        openModal(
          `Shootout ${scored ? 'Goal ✓' : 'Miss ×'} · ${team.name}`,
          `<p style="margin:0;color:var(--fg-muted);font-size:13px;">Select the penalty taker (sent-off players are ineligible per FIFA rules).</p>
           ${eligible.length
             ? `<div class="pick-grid">${playerBtns}</div>`
             : `<p class="empty-note" style="padding:10px;font-size:12.5px;">No players added for ${esc(team.name)} yet. Add players in the roster below, or type a name here:</p>`
           }
           <input class="input" id="am-so-txt" type="text" placeholder="Type player name / # (optional)">`,
          (body, acts) => {
            body.querySelectorAll('[data-so-p]').forEach(b => {
              b.addEventListener('click', () => {
                actionModal.hidden = true;
                recordShootoutKick(teamKey, scored, b.dataset.soP);
              });
            });
            acts.querySelector('#am-so-ok').addEventListener('click', () => {
              const val = body.querySelector('#am-so-txt').value.trim();
              actionModal.hidden = true;
              recordShootoutKick(teamKey, scored, val);
            });
          },
          `<button class="btn btn-sm" type="button" id="am-so-ok">Record ${scored ? 'Goal' : 'Miss'}</button>`
        );
      }

      const shootoutPick = { home: '', away: '' };

      function renderShootoutPanel() {
        const box = document.getElementById('shootout-mode-ui');
        const s = sides();
        const st = shootoutStats();
        const leftK = s.left === 'home' ? st.hKicks : st.aKicks;
        const rightK = s.right === 'home' ? st.hKicks : st.aKicks;
        const leftSc = s.left === 'home' ? st.hScore : st.aScore;
        const rightSc = s.right === 'home' ? st.hScore : st.aScore;

        const renderTeamRow = (teamKey, kicks) => {
          const t = state.teams[teamKey];
          const eligible = t.players.filter(p => !p.red);
          let dots = '';
          for (let i = 0; i < st.slots; i++) {
            const k = kicks[i];
            if (!k) dots += `<span class="so-dot">${i + 1}</span>`;
            else dots += `<span class="so-dot ${k.scored ? 'hit' : 'miss'}" title="${esc(k.player || (k.scored ? 'Scored' : 'Missed'))}">${k.scored ? '✓' : '×'}</span>`;
          }
          const opts = eligible.map(p =>
            `<option value="${esc(p.name)}" ${shootoutPick[teamKey] === p.name ? 'selected' : ''}>${p.num ? '#' + esc(p.num) + ' ' : ''}${esc(p.name)}</option>`
          ).join('');
          return `
            <div class="so-team-row">
              <div class="so-team-top">
                <span>${esc(t.name)}</span>
                <div style="display:flex;gap:4px;">
                  <button class="btn btn-xs" type="button" data-so-hit="${teamKey}">✓ Goal</button>
                  <button class="btn btn-danger btn-xs" type="button" data-so-miss="${teamKey}">× Miss</button>
                </div>
              </div>
              <select class="input" data-so-sel="${teamKey}" style="min-height:28px;padding:3px 8px;font-size:12px;" aria-label="Penalty taker for ${esc(t.name)}">
                <option value="">${eligible.length ? 'Select penalty taker…' : 'No players added yet (will prompt)'}</option>
                ${opts}
              </select>
              <div class="so-dots">${dots}</div>
            </div>
          `;
        };

        box.innerHTML = `
          <div class="so-header">
            <span>${st.suddenDeath ? 'Sudden Death' : 'No Time Limit'}</span>
            <span>Round ${st.round}${st.slots === 5 ? ' / 5' : ''}</span>
          </div>
          <div class="so-score">${leftSc} – ${rightSc}</div>
          ${st.winner ? `<div class="so-winner">🏆 ${esc(state.teams[st.winner].name)} wins shootout</div>` : ''}
          <div class="so-rows">
            ${renderTeamRow(s.left, leftK)}
            ${renderTeamRow(s.right, rightK)}
          </div>
          <div class="so-foot">
            <button class="btn btn-ghost btn-xs" type="button" id="btn-so-undo" ${!state.shootout.kicks.length ? 'disabled' : ''}>Undo kick</button>
            <button class="btn btn-ghost btn-xs" type="button" id="btn-so-reset" ${!state.shootout.kicks.length ? 'disabled' : ''}>Clear shootout</button>
          </div>
        `;

        box.querySelectorAll('[data-so-sel]').forEach(sel => sel.addEventListener('change', e => {
          shootoutPick[sel.dataset.soSel] = e.target.value;
        }));
        box.querySelectorAll('[data-so-hit]').forEach(b => b.addEventListener('click', () => {
          const tk = b.dataset.soHit;
          if (shootoutPick[tk]) {
            const p = shootoutPick[tk];
            shootoutPick[tk] = '';
            recordShootoutKick(tk, true, p);
          } else {
            promptShootoutKick(tk, true);
          }
        }));
        box.querySelectorAll('[data-so-miss]').forEach(b => b.addEventListener('click', () => {
          const tk = b.dataset.soMiss;
          if (shootoutPick[tk]) {
            const p = shootoutPick[tk];
            shootoutPick[tk] = '';
            recordShootoutKick(tk, false, p);
          } else {
            promptShootoutKick(tk, false);
          }
        }));
        box.querySelector('#btn-so-undo').addEventListener('click', () => {
          state.shootout.kicks.pop();
          saveState(); render();
        });
        box.querySelector('#btn-so-reset').addEventListener('click', () => {
          state.shootout.kicks = [];
          saveState(); render();
        });
      }

      // Match Report Builder
      function buildReportData() {
        const h = state.teams.home;
        const a = state.teams.away;
        const statusLabels = { upcoming: 'UPCOMING', live: 'LIVE', halftime: 'HALF-TIME', done: 'FULL TIME' };
        const now = new Date();
        const created = `${pad2(now.getDate())}/${pad2(now.getMonth() + 1)}/${now.getFullYear()}, ${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;

        const evChron = state.events.slice().reverse();
        const homeGoals = evChron.filter(e => e.type === 'goal' && e.team === 'home' && e.period !== 'Penalties');
        const awayGoals = evChron.filter(e => e.type === 'goal' && e.team === 'away' && e.period !== 'Penalties');
        const timeouts = evChron.filter(e => e.type === 'timeout');
        const cards = evChron.filter(e => e.type === 'yellow' || e.type === 'red');
        const fouls = evChron.filter(e => e.type === 'foul');
        const so = shootoutStats();

        return {
          h, a,
          statusText: statusLabels[state.status] || 'UPCOMING',
          created,
          homeGoals, awayGoals, timeouts, cards, fouls, so,
          hToCount: h.timeouts.filter(Boolean).length,
          aToCount: a.timeouts.filter(Boolean).length
        };
      }

      function fmtGoalLine(g) {
        const who = g.player || g.label;
        const ast = g.assist ? ` (Assist: ${g.assist})` : '';
        return `${who}${ast}`;
      }

      function buildPlainReportText() {
        const r = buildReportData();
        const lines = [
          'Mubaaraiy Manager',
          'Futsal',
          `${r.h.name} vs ${r.a.name} – MATCH REPORT`,
          '',
          `${r.h.name} ${r.h.score} – ${r.a.score} ${r.a.name}`,
          state.shootout.kicks.length ? `Penalties: ${r.h.name} ${r.so.hScore} – ${r.so.aScore} ${r.a.name}` : null,
          `Status: ${r.statusText}`,
          `Period: ${state.period}`,
          `Clock: ${state.period === 'Penalties' ? 'No time limit (Penalties)' : fmtClock(state.clockSec)}`,
          `Report created: ${r.created}`,
          '',
          `${r.h.name} goals`,
          r.homeGoals.length
            ? r.homeGoals.map(g => `• ${g.clock} (${g.period}) – ${fmtGoalLine(g)}`).join('\n')
            : `No goals for ${r.h.name}.`,
          '',
          `${r.a.name} goals`,
          r.awayGoals.length
            ? r.awayGoals.map(g => `• ${g.clock} (${g.period}) – ${fmtGoalLine(g)}`).join('\n')
            : `No goals for ${r.a.name}.`,
          '',
          'Timeouts',
          `${r.h.name}: ${r.hToCount}/2 – ${r.a.name}: ${r.aToCount}/2`,
          r.timeouts.length
            ? r.timeouts.map(t => `• ${t.clock} (${t.period}) – ${state.teams[t.team].name} (${t.label})`).join('\n')
            : 'No timeout times recorded.',
          '',
          'Cards & suspensions',
          r.cards.length
            ? r.cards.map(c => `• ${c.clock} (${c.period}) – ${c.label}: ${c.detail}`).join('\n')
            : 'No cards or suspensions recorded.',
          '',
          'Accumulated fouls',
          r.fouls.length
            ? `${r.h.name}: ${r.h.fouls} – ${r.a.name}: ${r.a.fouls}\n` + r.fouls.map(f => `• ${f.clock} (${f.period}) – ${f.detail}`).join('\n')
            : 'No accumulated fouls recorded.'
        ].filter(x => x !== null);
        return lines.join('\n');
      }

      document.getElementById('btn-share-report').addEventListener('click', async () => {
        const text = buildPlainReportText();
