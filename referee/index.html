      // Render Team Panel (Inline editable team name & color!)
      function renderTeamPanel(container, teamKey, roleLabel) {
        const t = state.teams[teamKey];
        const toAllowed = state.period === '1st Half' || state.period === '2nd Half';
        const idx = state.period === '2nd Half' ? 1 : 0;
        const halfLbl = idx === 0 ? '1H' : '2H';
        const toUsed = toAllowed && t.timeouts[idx];
        const activeSuspCount = state.suspensions.filter(s => s.team === teamKey).length;
        const onCourt = Math.max(3, 5 - activeSuspCount);

        const foulClass = t.fouls >= 6 ? 'foul-danger' : t.fouls === 5 ? 'foul-warn' : '';
        const pips = [1, 2, 3, 4, 5].map(n =>
          `<span class="foul-pip${t.fouls >= n ? ' on' : ''}${n === 5 ? ' fifth' : ''}"></span>`
        ).join('');

        container.style.setProperty('--tc', t.color || '#3d8a89');
        container.innerHTML = `
          <div class="tp-head">
            <input class="color-dot" type="color" value="${esc(t.color)}" data-tcolor aria-label="${roleLabel} team color">
            <input class="tp-name-input" type="text" maxlength="36" value="${esc(t.name)}" data-tname aria-label="${roleLabel} team name">
            ${activeSuspCount ? `<span class="tag t-rose" title="Playing short-handed due to red card">${onCourt} on court</span>` : ''}
            <span class="side-badge">${roleLabel}</span>
          </div>

          <div class="score-box">
            <button class="score-btn" type="button" data-score="-1" aria-label="Decrease score">−</button>
            <div class="score-num">${t.score}</div>
            <button class="score-btn plus" type="button" data-score="1" aria-label="Increase score">+</button>
          </div>

          <div class="fouls-box ${foulClass}">
            <div class="fouls-left">
              <span class="fouls-label">Fouls</span>
              <div class="foul-pips">
                ${pips}
                <span class="foul-count-txt">${t.fouls} / 5</span>
              </div>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-ghost btn-xs" type="button" data-foul="-1" ${t.fouls === 0 ? 'disabled' : ''}>−</button>
              <button class="btn btn-amber btn-xs" type="button" data-foul="1">+ Foul</button>
            </div>
          </div>

          <div class="action-grid">
            <button class="act-btn ${toUsed ? 'to-used' : ''}" type="button" data-to="1" ${!toAllowed ? 'disabled title="No time-outs in Extra Time (FIFA rule)"' : ''}>${toAllowed ? `TO · ${halfLbl}${toUsed ? ' ✓' : ''}` : 'No TO'}</button>
            <button class="act-btn" type="button" data-pen="1">Penalty</button>
            <button class="act-btn" type="button" data-act="yellow"><i class="bk bk-y"></i>Yellow</button>
            <button class="act-btn" type="button" data-act="red"><i class="bk bk-r"></i>Red</button>
          </div>
        `;

        container.querySelector('[data-tname]').addEventListener('change', e => {
          t.name = e.target.value.trim() || (teamKey === 'home' ? 'City Futsal' : 'United Futsal');
          saveState(); render();
        });
        container.querySelector('[data-tcolor]').addEventListener('input', e => {
          t.color = e.target.value;
          container.style.setProperty('--tc', t.color);
          saveState();
        });
        container.querySelectorAll('[data-score]').forEach(b => {
          b.addEventListener('click', () => {
            const d = Number(b.dataset.score);
            if (d > 0) promptGoal(teamKey);
            else recordGoal(teamKey, -1);
          });
        });
        container.querySelectorAll('[data-foul]').forEach(b => {
          b.addEventListener('click', () => adjustFoul(teamKey, Number(b.dataset.foul)));
        });
        container.querySelector('[data-to]').addEventListener('click', () => triggerTimeout(teamKey));
        container.querySelector('[data-pen]').addEventListener('click', () => promptPenalty(teamKey));
        container.querySelectorAll('[data-act]').forEach(b => {
          b.addEventListener('click', () => promptCard(teamKey, b.dataset.act));
        });
      }

      function renderRoster(container, teamKey) {
        const t = state.teams[teamKey];
        const rows = t.players.map(p => {
          const badges = [];
          if (p.goals) badges.push(`⚽${p.goals}`);
          if (p.assists) badges.push(`🅰️${p.assists}`);
          if (p.yellow) badges.push(`<i class="bk bk-y" style="width:7px;height:10px;"></i>×${p.yellow}`);
          if (p.red) badges.push(`<i class="bk bk-r" style="width:7px;height:10px;"></i>Out`);
          return `
            <li class="player-row ${p.red ? 'sent-off' : ''}">
              <span class="p-num">${esc(p.num || '–')}</span>
              <span class="p-name">
                <b>${esc(p.name)}</b>
                ${badges.length ? `<span class="p-badges">${badges.join(' ')}</span>` : ''}
              </span>
              <span class="p-acts">
                <button class="p-act" type="button" data-pg="${esc(p.id)}" title="${p.red ? 'Sent off — cannot return' : 'Goal (choose assist)'}" ${p.red ? 'disabled' : ''}>⚽</button>
                <button class="p-act" type="button" data-py="${esc(p.id)}" title="${p.red ? 'Sent off' : 'Yellow card'}" ${p.red ? 'disabled' : ''}><i class="bk bk-y" style="width:7px;height:10px;"></i></button>
                <button class="p-act" type="button" data-pr="${esc(p.id)}" title="${p.red ? 'Already sent off' : 'Red card (2:00)'}" ${p.red ? 'disabled' : ''}><i class="bk bk-r" style="width:7px;height:10px;"></i></button>
                ${(state.linked || p.fromMain) ? '' : `<button class="p-act" type="button" data-px="${esc(p.id)}" title="Remove player" style="color:var(--fg-dim);">×</button>`}
              </span>
            </li>
          `;
        }).join('');

        container.innerHTML = `
          <div class="deck-head">
            <div>
              <p class="kicker">GOAL SCORERS, ASSISTS &amp; CARDS</p>
              <h3>${esc(t.name)} players</h3>
            </div>
            ${state.linked ? `<span class="tag t-green" style="font-size:10px;">Synced · ${t.players.length}</span>` : ''}
          </div>
          ${state.linked ? '' : `
          <form class="roster-add-row" data-add-form>
            <input class="input" type="number" min="0" max="99" placeholder="#" data-pnum aria-label="Jersey number">
            <input class="input" type="text" maxlength="36" placeholder="Player name" data-pname aria-label="Player name">
            <button class="btn btn-sm" type="submit">+ Add</button>
          </form>`}
          <div class="scroll-area">
            ${t.players.length ? `<ul class="roster-list">${rows}</ul>` : `<p class="empty-note">${state.linked ? 'No players in this team in the main app yet' : 'No players added yet'}</p>`}
          </div>
        `;

        const addForm = container.querySelector('[data-add-form]');
        if (addForm) addForm.addEventListener('submit', e => {
          e.preventDefault();
          const numInp = container.querySelector('[data-pnum]');
          const nameInp = container.querySelector('[data-pname]');
          const name = nameInp.value.trim();
          if (!name) { nameInp.focus(); return; }
          t.players.push({ id: uid(), num: numInp.value.trim(), name, goals: 0, assists: 0, yellow: 0, red: 0 });
          saveState(); render();
          toast(`Added ${name} to ${t.name}`);
        });

        container.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => {
          const p = t.players.find(x => x.id === b.dataset.pg);
          if (p) promptGoal(teamKey, p.name);
        }));
        container.querySelectorAll('[data-py]').forEach(b => b.addEventListener('click', () => {
          const p = t.players.find(x => x.id === b.dataset.py);
          if (p) recordCard(teamKey, 'yellow', p.name);
        }));
        container.querySelectorAll('[data-pr]').forEach(b => b.addEventListener('click', () => {
          const p = t.players.find(x => x.id === b.dataset.pr);
          if (p) recordCard(teamKey, 'red', p.name);
        }));
        container.querySelectorAll('[data-px]').forEach(b => b.addEventListener('click', () => {
          const target = t.players.find(x => x.id === b.dataset.px);
          if (state.linked || (target && target.fromMain)) {
            toast('Players loaded from the main app cannot be deleted here.');
            return;
          }
          t.players = t.players.filter(x => x.id !== b.dataset.px);
          saveState(); render();
        }));
      }

      function isPeriodSwitchLocked() {
        if (state.period === 'Penalties') return false;
        if (state.status === 'upcoming') return false;
        return state.clockSec > 0;
      }

      function renderClockAndTimers() {
        const isPen = state.period === 'Penalties';
        const locked = isPeriodSwitchLocked();
        const selP = document.getElementById('sel-period');
        const nextP = document.getElementById('btn-next-period');
        if (selP) {
          selP.disabled = locked;
          selP.title = locked ? 'Period cannot be switched until the clock reaches 00:00' : 'Match period';
        }
        if (nextP) {
          nextP.disabled = locked;
          nextP.className = (!locked && !isPen && state.status !== 'upcoming') ? 'btn btn-xs' : 'btn btn-ghost btn-xs';
          nextP.title = locked ? 'Period cannot be switched until the clock reaches 00:00' : 'Advance period';
        }

        const panel = document.getElementById('clock-panel');
        panel.classList.toggle('is-running', state.clockRunning && !isPen);
        panel.classList.toggle('is-penalties', isPen);

        document.getElementById('timed-mode-ui').hidden = isPen;
        document.getElementById('shootout-mode-ui').hidden = !isPen;

        if (isPen) {
          renderShootoutPanel();
        } else {
          const disp = document.getElementById('clock-display');
          disp.textContent = fmtClock(state.clockSec);
          disp.classList.toggle('is-zero', state.clockSec === 0);

          const toggleBtn = document.getElementById('btn-clock-toggle');
          toggleBtn.className = state.clockRunning ? 'btn btn-live' : 'btn';
          toggleBtn.innerHTML = state.clockRunning
            ? `<svg class="i"><use href="#ic-pause"/></svg><span>Pause</span>`
            : `<svg class="i"><use href="#ic-play"/></svg><span>Start clock</span>`;
        }

        const tb = document.getElementById('timeout-banner');
        tb.hidden = !state.timeout;
        if (state.timeout) {
          document.getElementById('timeout-team-label').textContent = state.teams[state.timeout.team].name;
          document.getElementById('timeout-clock').textContent = fmtClock(state.timeout.sec);
        }

        const suspList = document.getElementById('susp-list');
        const suspTag = document.getElementById('susp-count-tag');
        suspList.hidden = !state.suspensions.length;
        suspTag.hidden = !state.suspensions.length;
        suspTag.textContent = `${state.suspensions.length} Susp`;

        suspList.innerHTML = state.suspensions.map(s => {
          const pct = Math.max(0, Math.min(100, (s.sec / s.total) * 100));
          return `
            <li class="susp-item">
              <div class="susp-top">
                <div class="susp-who">
                  <b>${esc(s.player)}</b>
                  <small>${esc(state.teams[s.team].name)} · ${state.clockRunning && state.period !== 'Half-Time' ? 'Counting down' : 'Paused'}</small>
                </div>
                <span class="susp-timer">${fmtClock(s.sec)}</span>
              </div>
              <div class="susp-bar"><i style="width:${pct}%"></i></div>
              <div class="susp-acts">
                <button class="btn btn-ghost btn-xs" type="button" data-susp-clear="${s.id}">Goal scored · End</button>
                <button class="btn btn-ghost btn-xs" type="button" data-susp-del="${s.id}" style="color:var(--rose-fg);">Remove</button>
              </div>
            </li>
          `;
        }).join('');

        suspList.querySelectorAll('[data-susp-clear]').forEach(b => b.addEventListener('click', () => {
          const s = state.suspensions.find(x => x.id === b.dataset.suspClear);
          if (s) addEvent(s.team, 'info', '2-min suspension ended early (goal)', s.player, s.player);
          state.suspensions = state.suspensions.filter(x => x.id !== b.dataset.suspClear);
          saveState(); render();
        }));
        suspList.querySelectorAll('[data-susp-del]').forEach(b => b.addEventListener('click', () => {
          state.suspensions = state.suspensions.filter(x => x.id !== b.dataset.suspDel);
          saveState(); render();
        }));
      }

      function renderEvents() {
        const list = document.getElementById('events-list');
        const empty = document.getElementById('events-empty');
        empty.hidden = state.events.length > 0;
        list.innerHTML = state.events.map(ev => {
          let ic = '•';
          if (ev.type === 'goal') ic = '⚽';
          else if (ev.type === 'yellow') ic = '<i class="bk bk-y"></i>';
          else if (ev.type === 'red') ic = '<i class="bk bk-r"></i>';
          else if (ev.type === 'foul') ic = '⚠️';
          else if (ev.type === 'timeout') ic = '⏱️';
          return `
            <li class="ev-item">
              <span class="ev-time">${esc(ev.clock)}</span>
              <span style="display:grid;place-items:center;width:16px;flex:none;">${ic}</span>
              <span class="ev-body">
                <b>${esc(ev.label)}</b>
                <small>${esc(ev.period)}${ev.detail ? ' · ' + esc(ev.detail) : ''}</small>
              </span>
              <button class="ev-del" type="button" data-ev-del="${ev.id}" aria-label="Remove event">×</button>
            </li>
          `;
        }).join('');

        list.querySelectorAll('[data-ev-del]').forEach(b => b.addEventListener('click', () => {
          state.events = state.events.filter(x => x.id !== b.dataset.evDel);
          saveState(); renderEvents();
        }));
      }

      function render() {
        const s = sides();
        const badge = document.getElementById('match-status-badge');
        const statusMap = {
          upcoming: ['UPCOMING', 'upcoming'],
          live: ['LIVE', 'live'],
          halftime: ['HALF-TIME', 'halftime'],
          done: ['FULL TIME', 'done']
        };
        const [stLabel, stCls] = statusMap[state.status] || statusMap.upcoming;
        badge.textContent = stLabel;
        badge.className = 'status ' + stCls;

        const matchBtn = document.getElementById('btn-match-state');
        if (state.status === 'upcoming') {
          matchBtn.textContent = 'Start match';
          matchBtn.className = 'btn btn-sm';
        } else if (state.status === 'done') {
          matchBtn.textContent = 'Reopen';
          matchBtn.className = 'btn btn-ghost btn-sm';
        } else {
          matchBtn.textContent = 'Finish';
          matchBtn.className = 'btn btn-live btn-sm';
        }

        document.getElementById('sel-period').value = state.period;
        document.getElementById('inp-half-mins').value = state.halfMinutes;
        document.getElementById('inp-break-mins').value = state.breakMinutes;

        renderTeamPanel(document.getElementById('panel-left'), s.left, s.left === 'home' ? 'HOME' : 'AWAY');
        renderTeamPanel(document.getElementById('panel-right'), s.right, s.right === 'home' ? 'HOME' : 'AWAY');
        renderRoster(document.getElementById('roster-left'), s.left);
        renderRoster(document.getElementById('roster-right'), s.right);
        renderClockAndTimers();
        renderEvents();
      }

      // Wire Controls
      document.getElementById('btn-swap').addEventListener('click', () => {
        state.swapped = !state.swapped;
        saveState(); render();
        toast('Swapped team sides');
      });

      document.getElementById('btn-match-state').addEventListener('click', () => {
        if (state.status === 'upcoming') {
          state.status = 'live';
          if (!state.kickAt) state.kickAt = Date.now();
          if (state.period !== 'Penalties') state.clockRunning = true;
          addEvent('home', 'info', 'Match started', `${state.teams.home.name} vs ${state.teams.away.name}`);
          playBuzzer(300, 520);
          toast('Match started!');
        } else if (state.status === 'done') {
          state.status = 'live';
          toast('Match reopened');
        } else {
          state.status = 'done';
          state.clockRunning = false;
          addEvent('home', 'info', 'Full time', `${state.teams.home.name} ${state.teams.home.score} – ${state.teams.away.score} ${state.teams.away.name}`);
          playBuzzer(900, 380);
          toast('Match marked Full Time — standings updated!');
        }
        saveState(); render();
      });

      document.getElementById('btn-clock-toggle').addEventListener('click', () => {
        if (state.clockSec === 0) return;
        state.clockRunning = !state.clockRunning;
        if (state.clockRunning && state.status === 'upcoming') state.status = 'live';
        saveState(); renderClockAndTimers();
      });

      document.getElementById('btn-clock-reset').addEventListener('click', () => {
        state.clockRunning = false;
        state.clockSec = (state.period === 'Half-Time' ? state.breakMinutes : state.halfMinutes) * 60;
        saveState(); renderClockAndTimers();
        toast('Clock reset');
      });

      document.querySelectorAll('[data-nudge]').forEach(b => {
        b.addEventListener('click', () => {
          state.clockSec = Math.max(0, state.clockSec + Number(b.dataset.nudge));
          saveState(); renderClockAndTimers();
        });
      });

      document.getElementById('sel-period').addEventListener('change', e => {
        if (isPeriodSwitchLocked()) {
          e.target.value = state.period;
          toast('Cannot switch period until the timer reaches 00:00');
          return;
        }
        state.period = e.target.value;
        state.clockRunning = false;
        if (state.period === 'Half-Time') {
          state.status = 'halftime';
          state.htAt = Date.now();
          state.clockSec = state.breakMinutes * 60;
        } else if (state.period === 'Penalties') {
          if (state.status === 'halftime') state.status = 'live';
          toast('Penalty Shootout mode (no time limit)');
        } else {
          if (state.status === 'halftime') state.status = 'live';
          if (state.period === '2nd Half') {
            state.h2At = Date.now();
            state.teams.home.fouls = 0;
            state.teams.away.fouls = 0;
          }
          state.clockSec = (state.period.startsWith('Extra') ? 5 : state.halfMinutes) * 60;
        }
        saveState(); render();
      });

      document.getElementById('btn-next-period').addEventListener('click', () => {
        if (isPeriodSwitchLocked()) {
          toast('Cannot switch period until the timer reaches 00:00');
          return;
        }
        state.clockRunning = false;
        if (state.period === '1st Half') {
          state.period = 'Half-Time';
          state.status = 'halftime';
          state.htAt = Date.now();
          state.clockSec = state.breakMinutes * 60;
          addEvent('home', 'info', 'Half-Time', `${state.teams.home.score} – ${state.teams.away.score}`);
          playBuzzer(700, 400);
          toast('Half-Time break');
        } else if (state.period === 'Half-Time') {
          state.period = '2nd Half';
          state.status = 'live';
          state.h2At = Date.now();
          state.clockSec = state.halfMinutes * 60;
          state.teams.home.fouls = 0;
          state.teams.away.fouls = 0;
          addEvent('home', 'info', '2nd Half started', 'Accumulated fouls reset to 0');
          toast('2nd Half · Fouls reset to 0');
        } else if (state.period === '2nd Half') {
          state.period = 'Extra Time 1';
          state.clockSec = 5 * 60;
          toast('Extra Time 1 (5:00) · 2nd-half fouls carry over, no time-outs');
        } else if (state.period === 'Extra Time 1') {
          state.period = 'Extra Time 2';
          state.clockSec = 5 * 60;
          toast('Extra Time 2 (5:00) · Fouls carry over, no time-outs');
        } else if (state.period === 'Extra Time 2') {
          state.period = 'Penalties';
          toast('Penalty Shootout mode (no time limit)');
        } else {
          state.status = 'done';
          addEvent('home', 'info', 'Full time', `${state.teams.home.score} – ${state.teams.away.score}`);
          toast('Match finished');
        }
        saveState(); render();
      });

      document.getElementById('inp-half-mins').addEventListener('change', e => {
        const v = Math.max(1, Math.min(60, parseInt(e.target.value, 10) || 20));
        state.halfMinutes = v;
        if (!state.clockRunning && state.period !== 'Half-Time') state.clockSec = v * 60;
        saveState(); render();
      });

      document.getElementById('inp-break-mins').addEventListener('change', e => {
        const v = Math.max(1, Math.min(30, parseInt(e.target.value, 10) || 5));
        state.breakMinutes = v;
        if (!state.clockRunning && state.period === 'Half-Time') state.clockSec = v * 60;
        saveState(); render();
      });

      document.getElementById('btn-end-timeout').addEventListener('click', () => {
        state.timeout = null;
        saveState(); renderClockAndTimers();
      });

      // FIFA 4-Second Rule Countdown Helper (Set-pieces & Goalkeeper possession)
      let fourSecTimer = null, fourSecVal = 0;
      const btn4s = document.getElementById('btn-4sec');
      const lbl4s = document.getElementById('lbl-4sec');
      btn4s.addEventListener('click', () => {
        if (fourSecTimer) {
          clearInterval(fourSecTimer);
          fourSecTimer = null;
          btn4s.classList.remove('active');
          lbl4s.textContent = '4s';
          return;
        }
        fourSecVal = 4;
        btn4s.classList.add('active');
        lbl4s.textContent = '4s';
        fourSecTimer = setInterval(() => {
          fourSecVal -= 1;
          if (fourSecVal <= 0) {
            clearInterval(fourSecTimer);
            fourSecTimer = null;
            btn4s.classList.remove('active');
            lbl4s.textContent = '4s';
            playBuzzer(380, 680);
            toast('4 seconds elapsed — Indirect free kick!');
          } else {
            lbl4s.textContent = fourSecVal + 's';
          }
        }, 1000);
      });

      document.getElementById('btn-horn').addEventListener('click', () => playBuzzer(650, 400));
      document.getElementById('btn-report-top').addEventListener('click', openMatchReport);

      document.getElementById('btn-clear-events').addEventListener('click', () => {
        if (!state.events.length) return;
        state.events = [];
        saveState(); renderEvents();
        toast('Event log cleared');
      });

      document.getElementById('btn-reset-match').addEventListener('click', () => {
        const isLinked = !!state.linked;
        openModal(
          'Reset Match?',
          `<p style="margin:0;color:var(--fg-muted);">This clears the score, accumulated fouls, timeouts, clock, shootout, suspensions, and events.${isLinked ? ' Teams and players synced from the main app will stay locked.' : ''}</p>`,
          (body, acts) => {
            acts.querySelector('#am-reset-scores').addEventListener('click', () => {
              const keepLinked = state.linked ? Object.assign({}, state.linked) : null;
              const keepHome = { name: state.teams.home.name, color: state.teams.home.color, players: state.teams.home.players.map(p => ({ ...p, goals: 0, assists: 0, yellow: 0, red: 0 })) };
              const keepAway = { name: state.teams.away.name, color: state.teams.away.color, players: state.teams.away.players.map(p => ({ ...p, goals: 0, assists: 0, yellow: 0, red: 0 })) };
              const half = state.halfMinutes, brk = state.breakMinutes;
              state = defaultState();
              state.linked = keepLinked;
              state.halfMinutes = half;
              state.breakMinutes = brk;
              state.clockSec = half * 60;
              Object.assign(state.teams.home, keepHome);
              Object.assign(state.teams.away, keepAway);
              actionModal.hidden = true;
              saveState(); render(); updateSyncPill();
              toast('Match reset (teams & players kept)');
            });
            const allBtn = acts.querySelector('#am-reset-all');
            if (allBtn) allBtn.addEventListener('click', () => {
              state = defaultState();
              actionModal.hidden = true;
              saveState(); render(); updateSyncPill();
              toast('Full reset complete');
            });
          },
          `<button class="btn btn-ghost btn-sm" type="button" id="am-reset-scores">Reset match only</button>
           ${isLinked ? '' : '<button class="btn btn-live btn-sm" type="button" id="am-reset-all">Reset everything</button>'}`
        );
      });

      // ============================================================

      // ============================================================
      const FB_CONFIG = {
        apiKey: 'AIzaSyCv3EUi5rlPlUxfa9aTNhcrfxwr8eGlBNA',
        authDomain: 'tournament-app-bb436.firebaseapp.com',
        projectId: 'tournament-app-bb436',
        storageBucket: 'tournament-app-bb436.firebasestorage.app',
        messagingSenderId: '511407905467',
        appId: '1:511407905467:web:08ccc8fe934ff7c2c3e79e'
      };
      const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const MEMBER_KEYS = ['predictions', 'bonus', 'answers'];

      const cloud = {
        ready: false,
        db: null,
        auth: null,
        user: null,
        member: null, // { id, name, role }
        tournaments: [],
        pickerTid: null,
        syncTimer: null,
        syncing: false
      };

      const connectModal = document.getElementById('connect-modal');
      connectModal.addEventListener('click', e => {
        if (e.target.closest('[data-close]')) connectModal.hidden = true;
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !connectModal.hidden) connectModal.hidden = true;
      });

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const sc = document.createElement('script');
          sc.src = src;
          sc.onload = resolve;
          sc.onerror = reject;
          document.head.appendChild(sc);
        });
      }

      function fbEmail(id, v) {
        return id.toLowerCase().replace(/[^a-z0-9_-]/g, '-') + (v ? '.r' + v : '') + '@members.' + FB_CONFIG.authDomain;
      }

      function canPushCloud() {
        return !!(cloud.db && cloud.member && (cloud.member.role === 'admin' || cloud.member.role === 'manager'));
      }

      function updateSyncPill() {
        const btn = document.getElementById('btn-connect');
        const lbl = document.getElementById('sync-label');
        btn.classList.toggle('linked', !!state.linked && canPushCloud());
        btn.classList.toggle('syncing', cloud.syncing);
        if (cloud.syncing) {
          lbl.textContent = 'Syncing…';
        } else if (state.linked) {
          lbl.textContent = `${state.linked.tournamentName} · M${state.linked.matchNo || ''}`;
        } else if (cloud.member) {
          lbl.textContent = 'Select Match';
        } else {
          lbl.textContent = 'Connect Tournament';
        }
      }

      function elapsedMinute() {
        const halfM = state.halfMinutes || 20;
        const elapsedInPeriod = Math.max(0, halfM * 60 - state.clockSec);
        const mins = Math.floor(elapsedInPeriod / 60) + 1;
        if (state.period === '2nd Half') return halfM + Math.min(halfM, mins);
        if (state.period === 'Extra Time 1') return halfM * 2 + mins;
        if (state.period === 'Extra Time 2') return halfM * 2 + 5 + mins;
        return Math.min(halfM, mins);
      }

      function scheduleCloudSync() {
        if (!state.linked || !canPushCloud()) return;
        clearTimeout(cloud.syncTimer);
        cloud.syncTimer = setTimeout(pushMatchToMainApp, 350);
      }

      async function pushMatchToMainApp() {
        if (!state.linked || !canPushCloud()) return;
        const t = cloud.tournaments.find(x => x.id === state.linked.tournamentId);
        if (!t) return;
        const copy = JSON.parse(JSON.stringify(t));
        MEMBER_KEYS.forEach(k => delete copy[k]);

        const m = (copy.matches || []).find(x => x.id === state.linked.matchId);
        if (!m) return;

        const homeId = state.linked.homeId;
        const awayId = state.linked.awayId;
        const teamIdFor = key => (key === 'home' ? homeId : awayId);

        // Build chronological goals & cards compatible with main app schema
        const chron = state.events.slice().reverse();
        const goalsArr = chron
          .filter(e => e.type === 'goal' && e.period !== 'Penalties')
          .map(e => {
            const rec = { team: teamIdFor(e.team), player: e.player || state.teams[e.team].name, min: e.min || elapsedMinute() };
            if (e.assist) rec.assist = e.assist;
            return rec;
          });
        const cardsArr = chron
          .filter(e => e.type === 'yellow' || e.type === 'red')
          .map(e => ({
            team: teamIdFor(e.team),
            player: e.player || state.teams[e.team].name,
            c: e.type === 'red' ? 'r' : 'y',
            min: e.min || elapsedMinute()
          }));

        // Live match state -> updates main app Live Score & Today's Matches
        const isLiveOrDone = state.status !== 'upcoming';
        m.started = isLiveOrDone;
        m.lh = state.teams.home.score;
        m.la = state.teams.away.score;
        m.lgoals = goalsArr;
        m.lcards = cardsArr;
        m.half = state.period === 'Half-Time' ? 'ht' : (state.period === '2nd Half' || state.period.startsWith('Extra') ? '2' : '1');
        if (isLiveOrDone && !m.kickAt) m.kickAt = state.kickAt || Date.now();
        if (state.htAt) m.htAt = state.htAt;
        if (state.h2At) m.h2At = state.h2At;

        // Futsal extra details (preserved cleanly alongside main app fields)
        m.fouls = { h: state.teams.home.fouls, a: state.teams.away.fouls };
        m.timeouts = { h: state.teams.home.timeouts.filter(Boolean).length, a: state.teams.away.timeouts.filter(Boolean).length };

        // Full-time result -> updates main app Standings / Points Table, Top Scorers & Cards
        if (state.status === 'done') {
          m.hs = state.teams.home.score;
          m.as = state.teams.away.score;
          m.goals = goalsArr.map(g => {
            const o = { team: g.team, player: g.player };
            if (g.assist) o.assist = g.assist;
            return o;
          });
          m.cards = cardsArr.map(c => ({ team: c.team, player: c.player, c: c.c }));
          if (!m.doneAt) m.doneAt = Date.now();

          const so = shootoutStats();
          if (state.shootout.kicks.length && m.hs === m.as) {
            m.ph = so.hScore;
            m.pa = so.aScore;
            if (so.hScore !== so.aScore) m.pens = so.hScore > so.aScore ? homeId : awayId;
          }
        } else {
          // If reopened or live, keep hs/as null so main app shows Live instead of Full Time
          m.hs = null;
          m.as = null;
          if (isLiveOrDone && (!copy.status || copy.status === 'upcoming')) copy.status = 'live';
        }

        cloud.syncing = true;
        updateSyncPill();
        try {
          await cloud.db.collection('tournaments').doc(copy.id).set(copy);
        } catch (e) {
          toast('Sync error: check permissions or internet connection.');
        } finally {
          cloud.syncing = false;
          updateSyncPill();
        }
      }

      function extractSquadPlayers(team, teamId, goalsList, cardsList) {
        const raw = Array.isArray(team && team.players) ? team.players
          : (Array.isArray(team && team.roster) ? team.roster : []);
        const mapped = raw.map((p, idx) => {
          const isStr = typeof p === 'string';
          const name = String(isStr ? p : (p && (p.name || p.player || p.fullName) || '')).trim();
          if (!name) return null;
          const numVal = !isStr && p ? (p.number ?? p.num ?? p.jersey ?? '') : '';
          const num = numVal === '' || numVal == null ? '' : String(numVal);
          return {
            id: (!isStr && p && p.id) ? String(p.id) : ('mp_' + idx + '_' + name.toLowerCase().replace(/\s+/g, '_')),
            num,
            name,
            fromMain: true,
            goals: goalsList.filter(g => g.team === teamId && g.player === name).length,
            assists: goalsList.filter(g => g.team === teamId && g.assist === name).length,
            yellow: cardsList.filter(c => c.team === teamId && c.player === name && c.c === 'y').length,
            red: cardsList.filter(c => c.team === teamId && c.player === name && c.c === 'r').length
          };
        }).filter(Boolean);

        return mapped.sort((a, b) => {
          const x = a.num === '' ? 1000 : Number(a.num);
          const y = b.num === '' ? 1000 : Number(b.num);
          return x - y || a.name.localeCompare(b.name);
        });
      }

      function syncLinkedRostersFromCloud() {
        if (!state.linked) return;
        const t = cloud.tournaments.find(x => x.id === state.linked.tournamentId);
        if (!t) return;
        const m = (t.matches || []).find(x => x.id === state.linked.matchId) || {};
        const isPlayed = m.hs != null && m.as != null;
        const allG = isPlayed ? (m.goals || []) : (m.lgoals || []);
        const allC = isPlayed ? (m.cards || []) : (m.lcards || []);
        let changed = false;

        [['home', state.linked.homeId], ['away', state.linked.awayId]].forEach(([key, tid]) => {
          const sq = (t.squads || []).find(s => String(s.id) === String(tid));
          if (!sq) return;
          const freshList = extractSquadPlayers(sq, tid, allG, allC);
          if (!freshList.length) return;
          const existingByName = new Map((state.teams[key].players || []).map(p => [p.name.toLowerCase(), p]));
          const merged = freshList.map(fp => {
            const prev = existingByName.get(fp.name.toLowerCase());
            return prev ? Object.assign({}, fp, {
              goals: Math.max(fp.goals, prev.goals || 0),
              assists: Math.max(fp.assists, prev.assists || 0),
              yellow: Math.max(fp.yellow, prev.yellow || 0),
              red: Math.max(fp.red, prev.red || 0),
              fromMain: true
            }) : fp;
          });
          if (JSON.stringify(merged) !== JSON.stringify(state.teams[key].players)) {
            state.teams[key].players = merged;
            changed = true;
          }
        });

        if (changed) {
          saveState(true);
          render();
        }
      }

      function loadMatchFromTournament(t, m) {
        const homeTeam = (t.squads || []).find(s => String(s.id) === String(m.home));
        const awayTeam = (t.squads || []).find(s => String(s.id) === String(m.away));
        if (!homeTeam || !awayTeam) {
          toast('Both teams must be assigned to this match first.');
          return;
        }
        const matchNo = (t.matches || []).indexOf(m) + 1;
        const isPlayed = m.hs != null && m.as != null;
        const srcGoals = isPlayed ? (m.goals || []) : (m.lgoals || []);
        const srcCards = isPlayed ? (m.cards || []) : (m.lcards || []);

        const homePlayers = extractSquadPlayers(homeTeam, m.home, srcGoals, srcCards);
        const awayPlayers = extractSquadPlayers(awayTeam, m.away, srcGoals, srcCards);

        // Reconstruct events log from existing live or saved goals/cards
        const rebuiltEvents = [];
        srcGoals.forEach(g => {
          const tk = g.team === m.away ? 'away' : 'home';
          const tm = tk === 'home' ? homeTeam.name : awayTeam.name;
          const detail = g.assist ? `${g.player} (Assist: ${g.assist}) · ${tm}` : `${g.player} · ${tm}`;
          rebuiltEvents.unshift({
            id: uid(), period: m.half === '2' ? '2nd Half' : '1st Half',
            clock: g.min ? `${pad2(g.min)}:00` : '00:00',
            team: tk, type: 'goal', label: 'Goal', detail, player: g.player, assist: g.assist || '', min: g.min
          });
        });
        srcCards.forEach(c => {
          const tk = c.team === m.away ? 'away' : 'home';
          const tm = tk === 'home' ? homeTeam.name : awayTeam.name;
          rebuiltEvents.unshift({
            id: uid(), period: m.half === '2' ? '2nd Half' : '1st Half',
            clock: c.min ? `${pad2(c.min)}:00` : '00:00',
            team: tk, type: c.c === 'r' ? 'red' : 'yellow',
            label: c.c === 'r' ? 'Red card' : 'Yellow card',
            detail: `${c.player} (${tm})`, player: c.player, min: c.min
          });
        });

        const fresh = defaultState();
        fresh.halfMinutes = state.halfMinutes || 20;
        fresh.breakMinutes = state.breakMinutes || 15;
        fresh.clockSec = fresh.halfMinutes * 60;
        fresh.status = isPlayed ? 'done' : m.started ? (m.half === 'ht' ? 'halftime' : 'live') : 'upcoming';
        fresh.period = m.half === 'ht' ? 'Half-Time' : m.half === '2' ? '2nd Half' : '1st Half';
        fresh.kickAt = m.kickAt || null;
        fresh.htAt = m.htAt || null;
        fresh.h2At = m.h2At || null;
        fresh.linked = {
          tournamentId: t.id,
          tournamentName: t.name,
          matchId: m.id,
          matchNo,
          stage: m.stage || '',
          ko: !!m.ko,
          homeId: m.home,
          awayId: m.away
        };
        fresh.teams.home = {
          name: homeTeam.name,
          color: homeTeam.c1 || '#3d8a89',
          score: isPlayed ? m.hs : (m.lh || 0),
          fouls: (m.fouls && m.fouls.h) || 0,
          timeouts: [false, false],
          players: homePlayers
        };
        fresh.teams.away = {
          name: awayTeam.name,
          color: awayTeam.c1 || '#2f6aa8',
          score: isPlayed ? m.as : (m.la || 0),
          fouls: (m.fouls && m.fouls.a) || 0,
          timeouts: [false, false],
          players: awayPlayers
        };
        fresh.events = rebuiltEvents;

        state = fresh;
        saveState(true);
        render();
        updateSyncPill();
        connectModal.hidden = true;
        toast(`Loaded M${matchNo}: ${homeTeam.name} (${homePlayers.length}) vs ${awayTeam.name} (${awayPlayers.length})`);
      }

      function renderConnectModal() {
        const body = document.getElementById('conn-body');
        const acts = document.getElementById('conn-actions');
        acts.innerHTML = `<button class="btn btn-ghost btn-sm" type="button" data-close>Close</button>`;

        if (!/^https?:$/.test(location.protocol)) {
          body.innerHTML = `
            <p style="margin:0;color:var(--fg-muted);font-size:14px;">
              Firebase live sync activates automatically when hosted on <b>https://</b> or <b>localhost</b> (your subdomain).
              Right now the app is running in standalone local mode.
            </p>`;
          return;
        }

        if (!cloud.ready) {
          body.innerHTML = `<p style="margin:0;color:var(--fg-muted);">Connecting to Mubaaraiy Manager database…</p>`;
          return;
        }

        // Step 1: Sign in with Member ID & Password (same as main app)
        if (!cloud.member) {
          body.innerHTML = `
            <p style="margin:0;color:var(--fg-muted);font-size:13.5px;">
              Sign in with your <b>Admin</b> or <b>Manager</b> Member ID to load tournament fixtures and sync live scores &amp; points table.
            </p>
            <form id="conn-login-form" style="display:grid;gap:10px;">
              <label style="display:grid;gap:4px;">
                <span class="kicker">Member ID</span>
                <input class="input" id="conn-id" type="text" placeholder="e.g. M-1001" autocapitalize="characters" required>
              </label>
              <label style="display:grid;gap:4px;">
                <span class="kicker">Password</span>
                <input class="input" id="conn-pass" type="password" placeholder="Password" required>
              </label>
              <p class="conn-err" id="conn-err" hidden></p>
              <button class="btn" type="submit" id="conn-submit">Sign in</button>
            </form>
          `;
          const form = body.querySelector('#conn-login-form');
          form.addEventListener('submit', async e => {
            e.preventDefault();
            const errEl = body.querySelector('#conn-err');
            const subBtn = body.querySelector('#conn-submit');
            const id = body.querySelector('#conn-id').value.trim().toUpperCase();
            const pass = body.querySelector('#conn-pass').value;
            errEl.hidden = true;
            subBtn.disabled = true;
            try {
              const doc = await cloud.db.collection('members').doc(id).get();
              if (!doc.exists) throw new Error('Member ID not found.');
              const m = doc.data();
              if (m.role !== 'admin' && m.role !== 'manager') throw new Error('Only Admin or Manager accounts can sync matches.');
              await cloud.auth.signInWithEmailAndPassword(fbEmail(id, m.v || 0), pass);
              cloud.member = Object.assign({ id }, m);
              toast(`Signed in as ${m.name || id}`);
              updateSyncPill();
              renderConnectModal();
            } catch (err) {
              errEl.textContent = err.message || 'Sign in failed. Check ID and password.';
              errEl.hidden = false;
              subBtn.disabled = false;
            }
          });
          return;
        }

        // Signed-in header bar
        const userBar = `
          <div class="conn-user-bar">
            <span>Signed in: <b>${esc(cloud.member.name || cloud.member.id)}</b> (${esc(cloud.member.role)})</span>
            <button class="btn btn-ghost btn-xs" type="button" id="conn-signout">Sign out</button>
          </div>
        `;

        // Step 2: Match picker inside a selected tournament
        const selectedT = cloud.pickerTid ? cloud.tournaments.find(x => x.id === cloud.pickerTid) : null;
        if (selectedT) {
          const matches = (selectedT.matches || []).filter(m => m.home && m.away);
          const teamName = id => ((selectedT.squads || []).find(s => s.id === id) || {}).name || 'TBD';
          const items = matches.map((m, i) => {
            const isCur = state.linked && state.linked.matchId === m.id;
            const isPlayed = m.hs != null && m.as != null;
            const st = isPlayed ? `FT ${m.hs}–${m.as}` : m.started ? `LIVE ${m.lh || 0}–${m.la || 0}` : 'Upcoming';
            return `
              <li>
                <button class="conn-item ${isCur ? 'active' : ''}" type="button" data-pick-m="${esc(m.id)}">
                  <span>
                    <b>${esc(teamName(m.home))} vs ${esc(teamName(m.away))}</b>
                    <small>Match ${i + 1}${m.stage ? ' · ' + esc(m.stage) : ''}</small>
                  </span>
                  <span class="tag ${isPlayed ? 't-amber' : m.started ? 't-rose' : 't-green'}">${st}</span>
                </button>
              </li>
            `;
          }).join('');

          body.innerHTML = `
            ${userBar}
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <b style="font:800 18px var(--font-display);text-transform:uppercase;">${esc(selectedT.name)}</b>
              <button class="btn btn-ghost btn-xs" type="button" id="conn-back">‹ All tournaments</button>
            </div>
            ${matches.length ? `<ul class="conn-list">${items}</ul>` : `<p class="empty-note">No matches scheduled in this tournament yet.</p>`}
          `;
          body.querySelector('#conn-back').addEventListener('click', () => { cloud.pickerTid = null; renderConnectModal(); });
          body.querySelectorAll('[data-pick-m]').forEach(b => b.addEventListener('click', () => {
            const m = (selectedT.matches || []).find(x => x.id === b.dataset.pickM);
            if (m) loadMatchFromTournament(selectedT, m);
          }));
        } else {
          // Step 2a: Tournament list
          const list = cloud.tournaments.filter(t => t.category !== 'Quiz');
          const items = list.map(t => {
            const mCount = (t.matches || []).filter(m => m.home && m.away).length;
            const isCur = state.linked && state.linked.tournamentId === t.id;
            return `
              <li>
                <button class="conn-item ${isCur ? 'active' : ''}" type="button" data-pick-t="${esc(t.id)}">
                  <span>
                    <b>${esc(t.name)}</b>
                    <small>${esc(t.category || 'Futsal')} · ${mCount} ${mCount === 1 ? 'match' : 'matches'}</small>
                  </span>
                  <span class="tag t-green">${esc(t.status || 'upcoming')}</span>
                </button>
              </li>
            `;
          }).join('');

          body.innerHTML = `
            ${userBar}
            ${state.linked ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--green-bg);color:var(--green-fg);font-size:13px;">
              <span>Linked: <b>${esc(state.linked.tournamentName)} · Match ${state.linked.matchNo}</b></span>
              <button class="btn btn-ghost btn-xs" type="button" id="conn-unlink">Unlink</button>
            </div>` : ''}
            <p class="kicker">SELECT TOURNAMENT</p>
            ${list.length ? `<ul class="conn-list">${items}</ul>` : `<p class="empty-note">No tournaments found.</p>`}
          `;
          body.querySelectorAll('[data-pick-t]').forEach(b => b.addEventListener('click', () => {
            cloud.pickerTid = b.dataset.pickT;
            renderConnectModal();
          }));
          const unlinkBtn = body.querySelector('#conn-unlink');
          if (unlinkBtn) unlinkBtn.addEventListener('click', () => {
            state.linked = null;
            saveState(true);
            updateSyncPill();
            renderConnectModal();
            toast('Unlinked from tournament');
          });
        }

        const signOutBtn = body.querySelector('#conn-signout');
        if (signOutBtn) signOutBtn.addEventListener('click', async () => {
          await cloud.auth.signOut();
          cloud.member = null;
          updateSyncPill();
          renderConnectModal();
          toast('Signed out');
        });
      }

      document.getElementById('btn-connect').addEventListener('click', () => {
        connectModal.hidden = false;
        renderConnectModal();
      });

      // Initialize Firebase & Service Worker when served over http/https
      if (/^https?:$/.test(location.protocol)) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
        loadScript(FB_SDK + 'firebase-app-compat.js')
          .then(() => Promise.all([
            loadScript(FB_SDK + 'firebase-auth-compat.js'),
            loadScript(FB_SDK + 'firebase-firestore-compat.js')
          ]))
          .then(() => {
            if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
            cloud.db = firebase.firestore();
            cloud.auth = firebase.auth();
            cloud.ready = true;

            cloud.auth.onAuthStateChanged(async user => {
              cloud.user = user || null;
              if (!user) {
                cloud.member = null;
                updateSyncPill();
                return;
              }
              try {
                const link = await cloud.db.collection('uids').doc(user.uid).get();
                if (link.exists) {
                  const mid = link.data().id;
                  const mDoc = await cloud.db.collection('members').doc(mid).get();
                  if (mDoc.exists) cloud.member = Object.assign({ id: mid }, mDoc.data());
                }
              } catch (e) {}
              updateSyncPill();
              if (!connectModal.hidden) renderConnectModal();
            });

            cloud.db.collection('tournaments').onSnapshot(snap => {
              cloud.tournaments = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
              cloud.tournaments.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

              // Support deep-link ?t=<tournamentId>&m=<matchId>
              const qs = new URLSearchParams(location.search);
              const qT = qs.get('t'), qM = qs.get('m');
              if (qT && qM && (!state.linked || state.linked.matchId !== qM)) {
                const foundT = cloud.tournaments.find(x => x.id === qT);
                const foundM = foundT && (foundT.matches || []).find(x => x.id === qM);
                if (foundT && foundM) loadMatchFromTournament(foundT, foundM);
              } else if (state.linked) {
                syncLinkedRostersFromCloud();
              }
              if (!connectModal.hidden) renderConnectModal();
            });

            updateSyncPill();
          })
          .catch(() => {});
      }

      render();
      updateSyncPill();
    })();
  </script>
</body>
</html>
